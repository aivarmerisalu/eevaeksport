<html>
  <head>
    <script type="text/javascript" src="https://www.gstatic.com/charts/loader.js"></script>
    <script type="text/javascript">
      google.charts.load("current", {packages:["corechart"]});
      google.charts.setOnLoadCallback(drawChart);
      function drawChart() {
        var data = google.visualization.arrayToDataTable([
          ['Task', 'Hours per Day'],
		  <!-- Start Data Section -->
        ['Katrin (KAT1)', 430],
        ['Erik (EEE2)', 350],
        ['Aivar (AIV1)', 500],
		  <!-- End Data Section -->
        ]);

        var options = {
          title: 'TITLE_PLACEHOLDER',
          pieHole: 0.3,
        };

        var chart = new google.visualization.PieChart(document.getElementById('ID_PLACEHOLDER'));
        chart.draw(data, options);
      }
    </script>
  </head>
  <body>
    <div id="ID_PLACEHOLDER" style="width: 100%; height: 100%;"></div>
  </body>
</html>
