  <script type="text/javascript">

    function drawTable() {
      var data = new google.visualization.DataTable();
      LABELS_PLACEHOLDER
      
      data.addRows([
        <!-- Start Data Section -->
        ['Mike',  {v:10000}, true],

        ['Bob',   {v: 7000,  f: '$7,000'},  true]
        <!-- End Data Section -->
      ]);

      var table = new google.visualization.Table(document.getElementById('ID_PLACEHOLDER'));
      var options = {

          headerCell: 'center-text',  // Style for header cells
          tableCell: 'center-text'    // Style for table cells
        }
      };
        <!-- Start Sort Section -->
      
        <!-- End Sort Section -->


      table.draw(data, options);
    }
  </script>
  <style>
