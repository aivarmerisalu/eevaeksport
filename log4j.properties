#### Use two appenders, one to log to console, another to log to a file
log4j.rootCategory=ERROR, errorfile
log4j.rootCategory=INFO, file

# Print only messages of priority WARN or higher for your category
log4j.category.eevaeksport.mailagent.MailAgent=INFO, file
# Specifically inherit the priority level
#log4j.category.your.category.name=INHERITED

#### First appender writes to console
#log4j.appender.stdout=org.apache.log4j.ConsoleAppender
#log4j.appender.stdout.layout=org.apache.log4j.PatternLayout

# Pattern to output the caller's file name and line number.
#log4j.appender.stdout.layout.ConversionPattern=%5p [%t] (%F:%L) - %m%n

#### First appender writes to a file
log4j.appender.file=org.apache.log4j.RollingFileAppender
log4j.appender.file.File=log/EevaEksport.log

#### Second appender writes to a file
log4j.appender.errorfile=org.apache.log4j.RollingFileAppender
log4j.appender.errorfile.File=log/error.log

# Control the maximum log file size
log4j.appender.file.MaxFileSize=500KB
log4j.appender.errorfile.MaxFileSize=100KB
# Archive log files (one backup file here)
log4j.appender.R.MaxBackupIndex=10

log4j.appender.file.layout=org.apache.log4j.PatternLayout
log4j.appender.file.layout.ConversionPattern=%p %t %c - %m%n

log4j.appender.errorfile.layout=org.apache.log4j.PatternLayout
log4j.appender.errorfile.layout.ConversionPattern=%p %t %c - %m%n
