plugins {
    // Apply the java plugin to add support for Java
    id 'java'

    // Apply the application plugin to add support for building an application
    id 'application'
}

sourceCompatibility = 1.10
targetCompatibility = 1.10

compileJava.options.encoding = "UTF-8"
compileTestJava.options.encoding = "UTF-8"

sourceSets {
    main {
        java {
            srcDirs = ['src', 'wrapper']
            include 'eevaeksport/util/SmsSender.java'
//            exclude { FileTreeElement elem -> ((
//                    !(
//                    elem.path.contains('eevaeksport/driver/AbstractDBDriver.java')
//                    || elem.path.contains('eevaeksport/driver/AlitaLTDBDriver.java')
//                    || elem.path.contains('eevaeksport/driver/SkaiteAGDBDriver.java')
//                    || elem.path.contains('eevaeksport/driver/IceAxaDBDriver.java')
//                    )
//                    && elem.path.contains('DBDriver.java')))}
//            exclude { FileTreeElement elem -> ((!(elem.path.contains('eevaeksport/imp/driver/AbstractImportDriver.java') || elem.path.contains('eevaeksport/imp/driver/SkaiteEugImportDriver.java')
//                ) && elem.path.contains('ImportDriver.java')))}
//            exclude 'eevaeksport/imp/SheetPrinterPrike.java'
//            exclude 'eevaeksport/report/Reporter.java'
        }
    }
}

repositories {
    jcenter()
}

dependencies {
    compile group: 'log4j', name: 'log4j', version: '1.2.17'
    compile group: 'javax.mail', name: 'mail', version: '1.5.0-b01'
    compile group: 'org.apache.poi', name: 'poi', version: '4.0.1'
    compile group: 'org.apache.poi', name: 'poi-ooxml', version: '4.0.1'
    compile group: 'org.apache.commons', name: 'commons-io', version: '1.3.2'
    compile group: 'net.lingala.zip4j', name: 'zip4j', version: '1.3.2'
    compile group: 'org.apache.pdfbox', name: 'pdfbox', version: '1.8.16'
    compile group: 'org.apache.httpcomponents', name: 'httpcore', version: '4.4.10'
    compile group: 'org.apache.httpcomponents', name: 'httpclient', version: '4.5.6'
    compile group: 'org.apache.httpcomponents', name: 'httpmime', version: '4.5.6'
    compile group: 'org.json', name: 'json', version: '20180813'
    compile group: 'net.contentobjects.jnotify', name: 'jnotify', version: '0.94'
    compile group: 'commons-net', name: 'commons-net', version: '3.6'
    compile group: 'org.apache.commons', name: 'commons-vfs2', version: '2.2'
    compile group: 'sshtools', name: 'j2ssh-core', version: '0.2.9'
    compile group: 'org.apache.axis', name: 'axis', version: '1.4'
    compile group: 'axis', name: 'axis-jaxrpc', version: '1.4'
    compile group: 'org.slf4j', name: 'slf4j-api', version: '1.8.0-beta2'
    compile group: 'org.slf4j', name: 'slf4j-simple', version: '1.8.0-beta2'
    compile files('lib/utils.jar', 'lib/ImageUtil.jar', 'lib/finj-1.1.5.jar')
}

// Define the main class for the application
//mainClassName = 'eevaeksport.EksportRunner'
mainClassName = 'eevaeksport.util.SmsSender'
